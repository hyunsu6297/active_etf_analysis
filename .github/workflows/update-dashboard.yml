name: Update ETF dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-dashboard.yml"
      - "build_etf_dashboard.py"
      - "etf_holdings_pipeline.py"
      - "update_daily_dashboard.py"
      - "requirements.txt"
      - "종목리스트.xlsx"
      - "data/parquet/**"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date, YYYY-MM-DD. Defaults to today in Korea."
        required: false
        type: string
  schedule:
    # 08:00 Asia/Seoul is 23:00 UTC on the previous day.
    - cron: "0 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve target date
        id: run_date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "target_date=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_date=$(date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ETF data and rebuild dashboard
        run: python update_daily_dashboard.py --date "${{ steps.run_date.outputs.target_date }}"

      - name: Commit updated data and dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data etf_active_weight_dashboard.html index.html
          if git diff --cached --quiet; then
            echo "No data or dashboard changes to commit."
          else
            git commit -m "Update ETF dashboard data"
            git push
          fi

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp plotly-2.35.2.min.js site/plotly-2.35.2.min.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
